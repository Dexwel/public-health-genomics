      path: contribute
      children:
        - type: space
          key: space-contribute
          title: Contribute
          path: contribute
          default: true
          content:
            directory: ./contribute
    - type: section
      key: section-host-it-yourself
      title: Host it yourself
      path: hosting
      children:
        - type: space
          key: space-hosting
          title: Host it yourself
          path: hosting
          default: true
          content:
            directory: ./hosting
    - type: section
      key: section-learner-showcase
      title: Learner showcase
      path: showcase
      children:
        - type: space
          key: space-showcase
          title: Learner showcase
          path: showcase
          default: true
          content:
            directory: ./showcase
