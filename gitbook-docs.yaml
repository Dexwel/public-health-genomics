$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Public Health Genomics
  structure:
    - type: section
      key: section-start-here
      title: Start here
      path: start-here
      default: true
      children:
        - type: space
          key: space-start-here
          title: Start here
          path: start-here
          default: true
          content:
            directory: ./start-here
    - type: section
      key: section-the-12-weeks
      title: The 12 weeks
      path: weeks
      children:
        - type: space
          key: space-weeks
          title: The 12 weeks
          path: weeks
          default: true
